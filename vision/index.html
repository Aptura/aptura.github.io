    <p class="lede reveal">
      Des photographies prises en marchant, le plus souvent tôt. Pas de
      mise en scène, pas de retouche appuyée : le lieu, la date, et ce

    </p>

    <!-- ════════════════════════════════════════════════════════════
         AJOUTER UNE PLANCHE
         Copier un bloc .plate et le placer EN HAUT de la liste
         (la plus récente en premier). Même principe que le carnet :
         l'ordre affiché est celui du fichier, il n'y a aucun tri.

         Les photos vont dans vision/photos/.
         Format libre : jamais recadrée.
         ════════════════════════════════════════════════════════════ -->
    <div class="plates reveal">

      <figure class="plate">
        <div class="plate-frame">
          <img src="photos/exemple.jpg" alt="Description de ce que montre la photo" loading="lazy">
        </div>
        <figcaption class="plate-caption">
          <p class="plate-title">Une phrase, si elle ajoute quelque chose. Sinon, rien.</p>
          <span class="plate-meta">Lieu · 00.00.26</span>
        </figcaption>
      </figure>
